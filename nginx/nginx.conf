worker_processes  auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # gzip оставляем включённым — для статики и API. HTML получает
    # отдельный location, в котором мы выключаем encoding ради sub_filter.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        application/javascript application/json application/xml
        text/css text/plain text/xml image/svg+xml;

    # Общие proxy-настройки выносим в map/include, но для краткости
    # повторяем критичные хедеры в каждом location-е.

    server {
        listen 80;
        server_name _;
        client_max_body_size 200M;

        # ----------------------------------------------------------
        # 1) Service worker от OM — пропускаем как есть.
        #    OM-овский /app-worker.js — это IndexedDB-прокси хранилища
        #    токенов через postMessage. Без него SPA не может сохранить
        #    access token после логина, и все API-запросы падают в 401.
        #    fetch-handler-а у него НЕТ → HTML не кешируется.
        #    no-store, чтобы браузер всегда брал свежую версию.
        # ----------------------------------------------------------
        location = /app-worker.js {
            proxy_pass http://openmetadata-server:8585;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        # ----------------------------------------------------------
        # 2) AI-виджет (статический файл).
        # ----------------------------------------------------------
        location = /omega3-ai/widget.js {
            alias /etc/nginx/widget.js;
            add_header Content-Type "application/javascript; charset=utf-8";
            add_header Cache-Control "no-cache";
        }

        # ----------------------------------------------------------
        # 3) AI-чат backend.
        #    `^~` — prefix с приоритетом над regex ниже,
        #    иначе regex `\.(js|css)$` ниже перехватит /omega3-ai/static/*.
        # ----------------------------------------------------------
        location ^~ /omega3-ai/ {
            proxy_pass http://ai-chat:8500/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ----------------------------------------------------------
        # 4) OpenMetadata API — без модификации, с gzip.
        #    `^~` чтобы regex ниже не перехватил, например, .json в /api/.
        # ----------------------------------------------------------
        location ^~ /api/ {
            proxy_pass http://openmetadata-server:8585;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ----------------------------------------------------------
        # 5) Статика OM (JS-чанки, CSS, шрифты, картинки) — пропускаем
        #    как есть, с upstream-сжатием и обычным кешем браузера.
        # ----------------------------------------------------------
        location ~* \.(js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|map|json)$ {
            proxy_pass http://openmetadata-server:8585;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ----------------------------------------------------------
        # 6) HTML / SPA-роуты — sub_filter инжектит AI-виджет.
        #    Здесь (и только здесь) отключаем encoding и кеширование.
        # ----------------------------------------------------------
        location / {
            proxy_pass http://openmetadata-server:8585;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            sub_filter_types text/html;
            sub_filter_once on;
            sub_filter '</body>' '<script>(function(){var s=document.createElement("script");s.src="/omega3-ai/widget.js?v="+Math.floor(Date.now()/60000);s.defer=true;document.head.appendChild(s);})();</script></body>';
        }
    }
}
