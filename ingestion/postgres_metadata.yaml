source:
  type: postgres
  serviceName: demo_postgres
  serviceConnection:
    config:
      type: Postgres
      username: demo_user
      authType:
        password: demo_secret_2024
      hostPort: postgres:5432
      database: demo
  sourceConfig:
    config:
      type: DatabaseMetadata
      markDeletedTables: true
      includeTables: true
      includeViews: true
      includeTags: true
      includeOwners: true
      overrideMetadata: false
      threads: 4
      schemaFilterPattern:
        includes:
          - "^bookings$"
      databaseFilterPattern:
        includes:
          - "^demo$"
