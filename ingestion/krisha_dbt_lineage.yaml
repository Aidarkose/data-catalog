source:
  type: dbt
  serviceName: krisha_dwh
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        dbtCatalogFilePath: /opt/airflow/krisha_dbt/target/catalog.json
        dbtManifestFilePath: /opt/airflow/krisha_dbt/target/manifest.json
      dbtUpdateDescriptions: true
      includeTags: true
      dbtClassificationName: krisha_dbt_tags

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ""
