source:
  type: postgres
  serviceName: atrocore
  serviceConnection:
    config:
      type: Postgres
      username: atrocore
      authType:
        password: atrocore_secret_2026
      hostPort: postgres:5432
      database: atrocore_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      markDeletedTables: true
      includeTables: true
      includeViews: true
      includeTags: true
      includeOwners: true
      overrideMetadata: false
      threads: 4
      schemaFilterPattern:
        includes:
          - "^public$"
      databaseFilterPattern:
        includes:
          - "^atrocore_db$"
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: "http://openmetadata-server:8585/api"
    authProvider: openmetadata
    securityConfig:
      jwtToken: ""
